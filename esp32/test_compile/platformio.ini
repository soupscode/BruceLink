; BruceLink ESP32-S3 bridge — standalone compile/link check.
; Compiles the bridge core + NimBLE central transport + shared protocol
; core against NimBLE-Arduino 2.5.1 for the ESP32-S3. Not the Bruce
; firmware; see src/main.cpp.
[env:s3-check]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -I ../lib/BruceLink
    -I ../../shared/brucelink_core/src
    -std=gnu++17
    ; as in the StickS3 build (the installer adds it there): NimBLE's host
    ; buffers in PSRAM. BOARD_HAS_PSRAM enables the override in the header.
    -DBOARD_HAS_PSRAM
    -include bl_nimble_psram.h ; found through -I ../lib/BruceLink
build_unflags = -std=gnu++11
; Canonical pin is the registry form `h2zero/NimBLE-Arduino@2.5.1` (as in
; Bruce's platformio.ini). The git URL below resolves to the same 2.5.1 tag
; and builds where the PlatformIO registry API is unreachable.
lib_deps =
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.1
